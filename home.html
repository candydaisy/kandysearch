<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a0f'/%3E%3Ctext x='32' y='46' font-family='Georgia%2C serif' font-size='42' font-weight='300' fill='%23ff69b8' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --border: rgba(255,105,170,0.15);
      --pink: #ff69b8;
      --pink-deep: #c0346e;
      --pink-pale: #ffd6ec;
      --pink-glow: rgba(255,105,170,0.25);
      --text: #f0e6ef;
      --muted: rgba(240,230,239,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #waves {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Noise grain */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.35;
    }

    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2rem;
      animation: rise 1.1s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      line-height: 1;
      user-select: none;
      filter: drop-shadow(0 0 22px rgba(255,105,170,0.5)) drop-shadow(0 0 6px rgba(255,105,170,0.3));
    }

    .logo span { display: inline-block; }
    .logo .g  { color: #ff69b8; }
    .logo .o1 { color: #e95faa; }
    .logo .o2 { color: #ff8ccb; }
    .logo .gl { color: #f5a0d0; }
    .logo .e  { color: #ff69b8; }

    .logo::after {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--pink), transparent);
      margin-top: 0.6rem;
      opacity: 0.5;
    }

    .search-wrap {
      width: min(580px, 90vw);
      position: relative;
    }

    .search-box {
      width: 100%;
      background: rgba(10,10,20,0.7);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.95rem 1.4rem 0.95rem 3.2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      letter-spacing: 0.01em;
    }

    .search-box::placeholder { color: var(--muted); }

    .search-box:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px var(--pink-glow), 0 8px 40px rgba(255,105,170,0.15);
      background: rgba(10,10,20,0.88);
    }

    .search-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.5;
    }
    .search-icon svg { width: 18px; height: 18px; stroke: var(--pink); fill: none; }

    .clear-btn {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .clear-btn svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; }
    .search-box:not(:placeholder-shown) ~ .clear-btn { opacity: 1; }

    .buttons {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      padding: 0.55rem 1.4rem;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.035);
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s;
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      background: rgba(255,105,170,0.12);
      border-color: var(--pink);
      color: var(--pink-pale);
      box-shadow: 0 0 18px rgba(255,105,170,0.2);
      transform: translateY(-1px);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--pink-deep), var(--pink));
      border-color: transparent;
      color: #fff;
      font-weight: 500;
      box-shadow: 0 4px 20px rgba(255,105,170,0.35);
    }

    .btn.primary:hover {
      box-shadow: 0 6px 28px rgba(255,105,170,0.5);
      transform: translateY(-2px);
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      opacity: 0;
      animation: fade-in 0.6s 1s ease forwards;
      white-space: nowrap;
    }

    @keyframes fade-in { to { opacity: 1; } }

    .footer a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .footer a:hover { color: var(--pink); }
  </style>
</head>
<body>

<canvas id="waves"></canvas>

<div class="card">
  <div class="logo">
    <span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="gl">g</span><span class="l">l</span><span class="e">e</span>
  </div>

  <div class="search-wrap">
    <span class="search-icon">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="22" y2="22"/>
      </svg>
    </span>
    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="Search anything…"
      autocomplete="off"
      onkeydown="handleKey(event)"
    />
    <button class="clear-btn" onclick="clearSearch()" tabindex="-1" aria-label="Clear">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="buttons">
    <button class="btn primary" onclick="doSearch()">Google Search</button>
    <button class="btn" onclick="doLucky()">I'm Feeling Lucky</button>
  </div>
</div>

<div class="footer">
  <a href="https://about.google" target="_blank">About</a> &nbsp;·&nbsp;
  <a href="https://google.com/privacy" target="_blank">Privacy</a> &nbsp;·&nbsp;
  <a href="https://google.com/terms" target="_blank">Terms</a>
</div>

<script>
  function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
    else document.getElementById('searchInput').focus();
  }
  function doLucky() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q) + '&btnI=1';
    else document.getElementById('searchInput').focus();
  }
  function handleKey(e) { if (e.key === 'Enter') doSearch(); }
  function clearSearch() {
    const inp = document.getElementById('searchInput');
    inp.value = '';
    inp.focus();
  }

  // Aggressive focus for New Tab Override compatibility
  // The extension wrapper steals focus after load, so we retry until it sticks
  (function focusSearch() {
    const inp = document.getElementById('searchInput');
    let attempts = 0;
    function tryFocus() {
      inp.focus();
      attempts++;
      if (document.activeElement !== inp && attempts < 20) {
        setTimeout(tryFocus, 50);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', tryFocus);
    } else {
      tryFocus();
    }
  })();

  // ── WAVE + BLOOM ──
  (function () {
    const wC = document.getElementById('waves');
    const wX = wC.getContext('2d');

    let W, H;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      wC.width  = W; wC.height  = H;
    }
    window.addEventListener('resize', resize);
    resize();

    // Waves — speeds are ~5× slower than typical animation values
    const WAVES = [
      { amp: 62,  freq: 0.0060, speed: 0.00016, y: 0.30, alpha: 0.22, w: 2.8, c: [255,  80, 160] },
      { amp: 48,  freq: 0.0090, speed: 0.00024, y: 0.40, alpha: 0.16, w: 2.0, c: [220,  50, 130] },
      { amp: 85,  freq: 0.0038, speed: 0.00010, y: 0.50, alpha: 0.24, w: 3.4, c: [255, 120, 190] },
      { amp: 32,  freq: 0.0110, speed: 0.00036, y: 0.58, alpha: 0.13, w: 1.6, c: [255,  60, 140] },
      { amp: 58,  freq: 0.0070, speed: 0.00019, y: 0.67, alpha: 0.18, w: 2.2, c: [200,  40, 110] },
      { amp: 42,  freq: 0.0050, speed: 0.00012, y: 0.22, alpha: 0.14, w: 2.0, c: [255, 150, 200] },
      { amp: 75,  freq: 0.0030, speed: 0.00008, y: 0.78, alpha: 0.26, w: 3.8, c: [255,  90, 170] },
      { amp: 28,  freq: 0.0130, speed: 0.00042, y: 0.15, alpha: 0.10, w: 1.3, c: [240,  70, 150] },
      { amp: 50,  freq: 0.0045, speed: 0.00014, y: 0.88, alpha: 0.20, w: 2.6, c: [255, 100, 175] },
    ];

    function strokeWave(ctx, wave, scaleX, scaleY, t, alphaBoost, widthBoost) {
      const baseY = H * wave.y * scaleY;
      const amp   = wave.amp * scaleY;
      ctx.beginPath();
      ctx.moveTo(0, baseY);
      const step = 3;
      for (let x = 0; x <= W * scaleX; x += step) {
        const xn = x / scaleX;
        const y  = baseY
          + Math.sin(xn * wave.freq + t * wave.speed) * amp
          + Math.sin(xn * wave.freq * 1.7 + t * wave.speed * 0.72 + 1.2) * (amp * 0.4)
          + Math.cos(xn * wave.freq * 0.5 + t * wave.speed * 0.5)         * (amp * 0.28);
        ctx.lineTo(x, y);
      }
      const [r, g, b] = wave.c;
      ctx.strokeStyle = `rgba(${r},${g},${b},${Math.min(wave.alpha * alphaBoost, 1)})`;
      ctx.lineWidth   = wave.w * widthBoost * scaleX;
      ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;
      ctx.shadowBlur  = 12 * scaleX;
      ctx.stroke();
      ctx.shadowBlur  = 0;
    }

    function renderBase(t) {
      wX.clearRect(0, 0, W, H);
      wX.fillStyle = '#0a0a0f';
      wX.fillRect(0, 0, W, H);

      // Ambient glow
      const g = wX.createRadialGradient(W*.5, H*.5, 0, W*.5, H*.5, W*.65);
      g.addColorStop(0,   'rgba(255,80,160,0.07)');
      g.addColorStop(0.5, 'rgba(180,30,100,0.03)');
      g.addColorStop(1,   'rgba(10,10,15,0)');
      wX.fillStyle = g;
      wX.fillRect(0, 0, W, H);

      WAVES.forEach(w => strokeWave(wX, w, 1, 1, t, 1, 1));
    }

    let elapsed = 0, lastTs = null;

    function tick(ts) {
      if (lastTs === null) lastTs = ts;
      elapsed += ts - lastTs;
      lastTs   = ts;

      renderBase(elapsed);

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
